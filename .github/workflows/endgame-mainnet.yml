name: ASHEM endgame guard (mainnet)

# Same guard as endgame.yml, wired to the REAL mainnet mint via the `mainnet`
# GitHub Environment. NOT dispatchable by the demo's GH_DISPATCH_TOKEN (that
# targets "ASHEM endgame guard" = endgame.yml), so a demo visitor can never
# trigger a mainnet run. State is written to state/mainnet/, isolated from devnet.

on:
  schedule:
    - cron: "20 */6 * * *"   # offset 20m from the devnet guard to avoid push races
  workflow_dispatch: {}

concurrency:
  group: endgame-mainnet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  endgame:
    runs-on: ubuntu-latest
    environment: mainnet
    env:
      STATE_DIR: state/mainnet
      PROOF_FILE: ENDGAME-mainnet.md
      ASHEM_MINT: ${{ vars.ASHEM_MINT }}
      ASHEM_VAULT: ${{ vars.ASHEM_VAULT }}
      ASHEM_RPC_URL: ${{ secrets.ASHEM_RPC_URL }}
      ASHEM_DEV_WALLET: ${{ vars.ASHEM_DEV_WALLET }}
      ASHEM_INDEXER_RPC: ${{ secrets.ASHEM_INDEXER_RPC }}
    steps:
      - name: Skip cleanly if the mainnet environment vars are not set yet
        id: cfg
        run: |
          if [ -z "$ASHEM_MINT" ] || [ -z "$ASHEM_VAULT" ] || [ -z "$ASHEM_RPC_URL" ] || [ -z "$ASHEM_DEV_WALLET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"; echo "mainnet env vars not set - skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v5
      - name: Install Solana CLI (pinned)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.2/install)"; then ok=1; break; fi
            echo "install attempt $i failed, retrying in 15s..."; sleep 15
          done
          [ "$ok" = 1 ] || { echo "Solana CLI install failed after 5 attempts"; exit 1; }
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Configure wallet from the mainnet secret (exists only during this run)
        if: steps.cfg.outputs.configured == 'true'
        env:
          KEYPAIR_JSON: ${{ secrets.ASHEM_AUTHORITY_KEYPAIR }}
        run: |
          umask 077
          printf '%s' "$KEYPAIR_JSON" > "$RUNNER_TEMP/authority.json"
          solana config set --url "$ASHEM_RPC_URL" --keypair "$RUNNER_TEMP/authority.json" >/dev/null
      - name: Snapshot log length before the run
        id: pre
        if: steps.cfg.outputs.configured == 'true'
        run: |
          n=0; [ -f "$STATE_DIR/endgame-log.txt" ] && n="$(wc -l < "$STATE_DIR/endgame-log.txt" | tr -d ' ')"
          echo "loglines=$n" >> "$GITHUB_OUTPUT"
      - name: Run endgame state machine (one action max)
        id: endgame
        if: steps.cfg.outputs.configured == 'true'
        run: bash scripts/endgame.sh
      - name: Generate endgame health report (read-only; append)
        if: always() && steps.cfg.outputs.configured == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENDGAME_OUTCOME: ${{ steps.endgame.outcome }}
          PREV_LOGLINES: ${{ steps.pre.outputs.loglines }}
        run: bash scripts/health-report.sh
      - name: Commit public state back to the repo
        if: always() && steps.cfg.outputs.configured == 'true'
        run: |
          git config user.name "ashem-endgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$STATE_DIR"
          git add "$PROOF_FILE" 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "endgame(mainnet): run $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && break
              echo "push retry $i"; sleep 5
            done
          fi